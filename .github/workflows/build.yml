name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Preparar projeto
        run: |
          if [ -f projeto.zip ]; then
            mkdir -p work
            unzip -q -o projeto.zip -d work
            DIR=$(dirname "$(find work -name settings.gradle.kts | head -1)")
          else
            DIR=.
          fi
          echo "PROJ=$DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: UltimateGameBooster-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
